# AeroSpace: tiling + workspace bernomor, meniru setelan Kun Chen
# (video 2026-09-13, MSbacZ99E14). Kun tidak pernah menyebut alatnya; vonis
# AeroSpace berasal dari potongan jendela tersembunyi di pojok kanan-bawah
# layar, ciri khas AeroSpace. Lihat data/kun-visual/report.md.
#
# Ukuran di bawah dalam point macOS, diukur dari bingkai 1920x1080 Kun dengan
# skala ~1.47 px video per point (tinggi baris Hack 15pt dan lampu lalu lintas).

# Bar dan bingkai dijalankan dari sini, jadi mematikan AeroSpace mematikan
# ketiganya sekaligus: satu sakelar untuk seluruh tampilan.
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders',
  'exec-and-forget /opt/homebrew/bin/sketchybar',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Bar Kun hanya menampilkan nomor workspace yang sedang aktif; SketchyBar
# diberi tahu tiap kali workspace berganti.
exec-on-workspace-change = [
  '/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

[key-mapping]
preset = 'qwerty'

# Celah Kun: 12 px video (~8 pt) dari kiri, kanan, bawah, dan dari bar.
# Tepi atas jendela ada di 70 px (~48 pt) = y_offset bar 7 + tinggi 33 + celah 8.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 48
outer.right = 8

# Pintasan bawaan AeroSpace, dikurangi workspace huruf (alt-a..alt-z) karena
# bentrok dengan alt-b/alt-f (lompat kata di zsh) dan alt-p/alt-t (Claude Code).
# Pintasan Kun sendiri tidak pernah terlihat di video.
[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Penempatan aplikasi Kun di video terbaru: terminal "1", Discord "3",
# Chrome "7" (di video Juli Chrome masih di "5").
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 7'

# Jendela setelan tidak cocok di-tile.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
